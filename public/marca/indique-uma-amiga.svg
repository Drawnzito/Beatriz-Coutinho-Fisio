<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f5c57"/>
      <stop offset="55%" stop-color="#1a4f4a"/>
      <stop offset="100%" stop-color="#143d3a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#fundo)"/>

  <!-- Arabesco como textura discreta, sangrando pela direita -->
  <g stroke="#2a6760" stroke-width="7" fill="none" opacity="0.5">
    <path d="M1040 -60 C1230 130, 1225 340, 1060 440 C940 510, 935 620, 1040 700 C1100 745, 1160 765, 1230 772"/>
    <path d="M1150 70 C1255 210, 1245 345, 1155 425"/>
  </g>

  <!-- Faixa terracota da marca -->
  <rect x="0" y="0" width="20" height="800" fill="#a2465a"/>

  <!-- Marca -->
  <g transform="translate(92, 86)">
    <path d="M16 -16 C54 -44, 96 -54, 134 -62" stroke="#e9b8c4" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="26" cy="-24" r="11" fill="#e9b8c4"/>
    <text x="0" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" fill="#faf8f5">B</text>
    <text x="48" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" fill="#dfe6e2">C</text>
    <text x="134" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4.5" fill="#cfdbd6">BEATRIZ COUTINHO</text>
    <text x="134" y="54" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4.5" fill="#9fb8b1">FISIOTERAPIA</text>
  </g>

  <!-- Chamada -->
  <text x="92" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="700" fill="#ffffff">Indique uma amiga</text>

  <text x="96" y="392" font-family="'Segoe UI', Arial, sans-serif" font-size="36" fill="#d8e4df">e ela ganha desconto na primeira sessão</text>

  <!-- Selo do desconto -->
  <g transform="translate(96, 452)">
    <rect x="0" y="0" width="610" height="138" rx="69" fill="#a2465a"/>
    <text x="54" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#ffffff">50% OFF</text>
    <rect x="390" y="36" width="3" height="66" fill="#e9b8c4" opacity="0.6"/>
    <text x="422" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="27" font-weight="600" fill="#ffffff">na primeira</text>
    <text x="422" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="27" font-weight="600" fill="#ffffff">sessão</text>
  </g>

  <!-- Rodapé -->
  <text x="96" y="688" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#a9c0ba">Válido para fisioterapia pélvica domiciliar</text>
</svg>
