<!--
  Arte da promoção de indicação.

  Canvas 4:3 (1200x900), que é a proporção do cartão de destaque no celular.
  No computador o cartão vira 16:9 e o navegador corta topo e base — por isso
  TODO o conteúdo fica dentro da faixa y=150..750 (a "área segura"), que é o
  que sobra depois desse corte. Fora dela só existe fundo.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f5c57"/>
      <stop offset="70%" stop-color="#163f3c"/>
      <stop offset="100%" stop-color="#11302e"/>
    </linearGradient>

    <radialGradient id="brilho" cx="18%" cy="10%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="selo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c25a71"/>
      <stop offset="100%" stop-color="#a2465a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#fundo)"/>
  <rect width="1200" height="900" fill="url(#brilho)"/>

  <!-- Arabesque da marca, ampliado, no canto direito -->
  <g transform="translate(720 190) scale(2.3)" opacity="0.13">
    <path d="M 210 20 C 150 20, 130 70, 150 105 C 165 130, 205 128, 215 150 C 222 165, 210 172, 195 170"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ===== área segura: y 150 a 750 ===== -->

  <!-- Marca BC -->
  <g transform="translate(96 162) scale(0.42)">
    <path d="M 46 205 C 30 150, 60 60, 150 40 C 205 28, 245 45, 272 18"
          fill="none" stroke="#f1d9df" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <circle cx="150" cy="40" r="12" fill="#f1d9df" opacity="0.9"/>
    <text x="18" y="188" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
          font-size="160" fill="#ffffff">B</text>
    <text x="128" y="188" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
          font-size="160" fill="#f1d9df">C</text>
  </g>

  <text x="96" y="302" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="21"
        font-weight="600" letter-spacing="5.5" fill="#ffffff" opacity="0.72">
    BEATRIZ COUTINHO FISIOTERAPIA
  </text>

  <g transform="translate(96 332) scale(0.95)" opacity="0.5">
    <path d="M 4 18 C 22 4, 38 24, 60 12 C 82 -2, 98 22, 120 10 C 142 -2, 158 20, 180 8 C 202 -4, 220 18, 242 6 C 262 -4, 282 14, 304 4"
          fill="none" stroke="#f1d9df" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <text x="96" y="444" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="82" fill="#ffffff">Indique uma amiga</text>

  <text x="96" y="512" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"
        font-size="29" fill="#ffffff" opacity="0.88">
    e ela ganha desconto na primeira sessão
  </text>

  <g transform="translate(96 558)">
    <rect width="446" height="92" rx="46" fill="url(#selo)"/>
    <text x="42" y="62" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
          font-size="52" fill="#ffffff">50% OFF</text>
    <line x1="286" y1="26" x2="286" y2="66" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <text x="312" y="48" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"
          font-size="17" font-weight="600" fill="#ffffff" opacity="0.95">na primeira</text>
    <text x="312" y="70" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"
          font-size="17" font-weight="600" fill="#ffffff" opacity="0.95">sessão</text>
  </g>

  <text x="96" y="710" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="20"
        fill="#f1d9df" opacity="0.8">
    Válido para fisioterapia pélvica domiciliar
  </text>

  <!-- Marcador terracota na borda esquerda -->
  <rect x="0" y="0" width="14" height="900" fill="#a2465a"/>
</svg>
